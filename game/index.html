<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velamar — Open-World Crime</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c141c;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .hidden { display: none !important; }
  .hud-top-left { position: absolute; top: 14px; left: 16px; }
  .stars { font-size: 30px; letter-spacing: 4px; color: #666; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .stars.w1, .stars.w2 { color: #ffd23a; }
  .stars.w3, .stars.w4, .stars.w5 { color: #ff5a3a; animation: blink .7s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: .55; } }
  .rank { font-size: 13px; letter-spacing: 1px; opacity: .9; text-shadow: 0 1px 4px #000; margin-top: 2px; }
  .hud-top-right { position: absolute; top: 14px; right: 16px; text-align: right; }
  .cash { font-size: 30px; font-weight: 800; color: #7ddb8a; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .clock, .district { font-size: 14px; opacity: .92; text-shadow: 0 1px 4px #000; }
  .objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(8,14,20,.72); border-left: 4px solid #ffd23a; padding: 9px 16px;
    border-radius: 4px; max-width: 560px; }
  .objective-text { font-size: 16px; font-weight: 700; }
  .objective-dist { font-size: 12px; opacity: .8; }
  .hud-bottom-left { position: absolute; left: 16px; bottom: 16px; }
  .minimap { border: 2px solid rgba(255,255,255,.55); border-radius: 50%;
    box-shadow: 0 4px 18px rgba(0,0,0,.6); background: #0c141c; }
  .hud-bottom-right { position: absolute; right: 16px; bottom: 16px; text-align: right; }
  .bars { margin-bottom: 8px; }
  .bar { width: 230px; height: 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.4);
    border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .bar .fill { height: 100%; transition: width .15s; }
  .bar.health .fill { background: linear-gradient(90deg, #e8e8e8, #ffffff); }
  .bar.armor .fill { background: linear-gradient(90deg, #4a8cff, #7db4ff); }
  .weapon { font-size: 17px; font-weight: 700; text-shadow: 0 1px 4px #000; }
  .speed { font-size: 26px; font-weight: 800; text-shadow: 0 2px 6px #000; }
  .radio { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 14px; background: rgba(8,14,20,.65); padding: 6px 14px; border-radius: 20px; }
  .hint { position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%);
    font-size: 12px; opacity: .75; text-shadow: 0 1px 3px #000; white-space: nowrap; }
  .crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 26px; font-weight: 300; color: rgba(255,255,255,.9); text-shadow: 0 0 4px #000; display: none; }
  .center-msg { position: absolute; left: 50%; top: 62%; transform: translateX(-50%);
    font-size: 16px; font-weight: 600; background: rgba(8,14,20,.7); padding: 8px 16px;
    border-radius: 4px; opacity: 0; transition: opacity .2s; }
  .center-msg.show { opacity: 1; }
  .phone { position: absolute; right: 16px; top: 120px; width: 260px; background: rgba(10,16,24,.92);
    border: 1px solid #ffd23a; border-radius: 10px; padding: 12px 14px; opacity: 0;
    transform: translateX(20px); transition: opacity .25s, transform .25s; }
  .phone.show { opacity: 1; transform: translateX(0); }
  .phone-name { font-weight: 800; color: #ffd23a; font-size: 14px; margin-bottom: 4px; }
  .phone-text { font-size: 14px; line-height: 1.45; }
  .toasts { position: absolute; left: 16px; bottom: 250px; }
  .toast { background: rgba(8,14,20,.8); border-left: 3px solid #39d0c2; padding: 7px 12px;
    margin-top: 6px; border-radius: 3px; font-size: 14px; animation: toastin .2s; }
  @keyframes toastin { from { transform: translateX(-12px); opacity: 0; } }
  .banner { position: absolute; left: 50%; top: 34%; transform: translateX(-50%) scale(.96);
    text-align: center; opacity: 0; transition: opacity .3s, transform .3s; }
  .banner.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .banner-title { font-size: 52px; font-weight: 900; letter-spacing: 3px; color: #ffd23a;
    text-shadow: 0 3px 0 #7a2a1a, 0 6px 22px rgba(0,0,0,.8); }
  .banner-sub { font-size: 18px; text-shadow: 0 2px 6px #000; margin-top: 4px; }
  .wheel { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
  .wheel.show { opacity: 1; }
  .wheel-slot { position: absolute; left: -90px; top: -26px; width: 180px; text-align: center;
    background: rgba(8,14,20,.85); border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
    padding: 8px 6px; font-size: 14px; }
  .wheel-slot.current { border-color: #ffd23a; background: rgba(60,44,8,.92); }
  .wheel-slot.locked { opacity: .45; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: linear-gradient(180deg, rgba(6,12,20,.55), rgba(6,12,20,.88));
    pointer-events: auto; text-align: center; padding: 20px; }
  .game-title { font-size: 96px; font-weight: 900; letter-spacing: 12px; color: #ffd23a;
    text-shadow: 0 4px 0 #7a2a1a, 0 10px 40px rgba(0,0,0,.9); line-height: 1; }
  .game-sub { font-size: 20px; margin-top: 10px; text-shadow: 0 2px 6px #000; }
  .game-tag { font-size: 13px; opacity: .85; max-width: 640px; margin-top: 14px; line-height: 1.6; }
  .btn-row { display: flex; gap: 12px; margin-top: 26px; }
  .btn { pointer-events: auto; cursor: pointer; background: rgba(255,255,255,.12); color: #fff;
    border: 1px solid rgba(255,255,255,.5); border-radius: 6px; padding: 12px 26px;
    font-size: 16px; font-weight: 700; letter-spacing: 1px; }
  .btn:hover { background: rgba(255,255,255,.25); }
  .btn.primary { background: #ffd23a; color: #1a1405; border-color: #ffd23a; }
  .btn.small { padding: 6px 14px; font-size: 13px; }
  .title-foot { font-size: 12px; opacity: .7; margin-top: 26px; }
  .screen-title { font-size: 34px; font-weight: 900; letter-spacing: 3px; color: #ffd23a; margin-bottom: 18px; }
  .shop-list { width: min(680px, 92vw); max-height: 52vh; overflow-y: auto; text-align: left; }
  .shop-row { display: flex; justify-content: space-between; align-items: center; gap: 14px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 6px;
    padding: 10px 14px; margin-bottom: 8px; font-size: 14px; }
  .shop-row b { color: #ffd23a; }
  .shop-row i { opacity: .7; font-style: normal; font-size: 12px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Velamar: drive, fight and take the city"></canvas>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
